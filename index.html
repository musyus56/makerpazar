<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiyat Teklif Formu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: #f4f7fc;
            padding: 2rem;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        .panel-header {
            background: white;
            border-radius: 24px;
            padding: 1.5rem 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .panel-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin: 0;
        }
        .panel-header .back-btn {
            background: #eef2ff;
            color: #0a66c2;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 40px;
            font-weight: 500;
            text-decoration: none;
            transition: 0.2s;
        }
        .panel-header .back-btn:hover {
            background: #dbeafe;
        }
        .panel-content {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
        }
        .panel-footer {
            margin-top: 2rem;
            text-align: center;
            color: #94a3b8;
            font-size: 0.8rem;
        }
        .form-section {
            background: #f8fafc;
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .form-section h5 {
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 1rem;
        }
        .item-row {
            background: white;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .total-box {
            background: #eef2ff;
            border-radius: 12px;
            padding: 1rem 1.5rem;
            text-align: right;
            font-size: 1.2rem;
            font-weight: 700;
            color: #0a66c2;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 1300px;">
        
        <!-- Panel Başlığı -->
        <div class="panel-header">
            <div>
                <span class="badge bg-primary me-2">#9</span>
                <h1>📄 Fiyat Teklif Formu</h1>
                <p class="text-muted small mt-1">Müşterilere hızlı fiyat teklifi oluşturun</p>
            </div>
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-left me-2"></i> Ana Paneli Dön
            </a>
        </div>

        <!-- Panel İçeriği -->
        <div class="panel-content">
            
            <div class="row g-4">
                <!-- Müşteri Bilgileri -->
                <div class="col-md-6">
                    <div class="form-section">
                        <h5><i class="fas fa-user me-2 text-primary"></i> Müşteri Bilgileri</h5>
                        <div class="mb-3">
                            <label class="form-label">Müşteri Adı / Firma</label>
                            <input type="text" class="form-control" placeholder="Müşteri adını girin">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Telefon</label>
                            <input type="text" class="form-control" placeholder="Telefon numarası">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" placeholder="Email adresi">
                        </div>
                        <div class="mb-0">
                            <label class="form-label">Adres</label>
                            <textarea class="form-control" rows="2" placeholder="Adres bilgisi"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Teklif Bilgileri -->
                <div class="col-md-6">
                    <div class="form-section">
                        <h5><i class="fas fa-file-signature me-2 text-primary"></i> Teklif Bilgileri</h5>
                        <div class="row g-3">
                            <div class="col-6">
                                <label class="form-label">Teklif No</label>
                                <input type="text" class="form-control" value="TEKLIF-2025-001" readonly>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Tarih</label>
                                <input type="date" class="form-control">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Geçerlilik Tarihi</label>
                                <input type="date" class="form-control">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Teklif Notu</label>
                                <input type="text" class="form-control" placeholder="Varsa not girin">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Ürün Kalemleri -->
                <div class="col-12">
                    <div class="form-section">
                        <h5><i class="fas fa-list me-2 text-primary"></i> Ürün / Hizmet Kalemleri</h5>
                        <div class="item-row">
                            <span><strong>Ürün 1</strong> <span class="text-muted">(2 adet)</span></span>
                            <span>₺ 1.500,00</span>
                        </div>
                        <div class="item-row">
                            <span><strong>Ürün 2</strong> <span class="text-muted">(1 adet)</span></span>
                            <span>₺ 2.250,00</span>
                        </div>
                        <div class="item-row">
                            <span><strong>Ürün 3</strong> <span class="text-muted">(3 adet)</span></span>
                            <span>₺ 4.200,00</span>
                        </div>
                        <div class="row g-2 mt-2">
                            <div class="col-md-4">
                                <input type="text" class="form-control" placeholder="Ürün adı">
                            </div>
                            <div class="col-md-3">
                                <input type="number" class="form-control" placeholder="Adet">
                            </div>
                            <div class="col-md-3">
                                <input type="number" class="form-control" placeholder="Birim fiyat">
                            </div>
                            <div class="col-md-2">
                                <button class="btn btn-primary w-100"><i class="fas fa-plus"></i></button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Toplam -->
                <div class="col-12">
                    <div class="total-box">
                        <span class="text-muted" style="font-weight:400;">Toplam Tutar:</span>
                        ₺ 7.950,00
                    </div>
                </div>

                <!-- Butonlar -->
                <div class="col-12">
                    <div class="d-flex gap-3 justify-content-end flex-wrap">
                        <button class="btn btn-success btn-lg">
                            <i class="fas fa-file-pdf me-2"></i> PDF Olarak Kaydet
                        </button>
                        <button class="btn btn-primary btn-lg">
                            <i class="fas fa-save me-2"></i> Kaydet
                        </button>
                        <button class="btn btn-outline-secondary btn-lg">
                            <i class="fas fa-print me-2"></i> Yazdır
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <div class="panel-footer">
            © 2025 — Kurumsal İç Sistem | Fiyat Teklif Formu
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
